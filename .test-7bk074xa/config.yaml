api:
  headers:
    Authorization: Bearer PRIVATE_KEY
  payload:
    messages:
    - content: '{{prompts.system}}'
      role: system
    - content: '{{prompts.user}}'
      role: user
    model: test
    stream: false
  url: https://mock.invalid/ai?token=PRIVATE_URL
prompts:
  system: PRIVATE_PROMPT
  user: '{{task.text}}'
run:
  backoff_base_seconds: 0.001
  backoff_max_seconds: 0.001
  batch_size: 200
  concurrency: 1
  flush_interval_seconds: 0.01
  max_attempts: 2
  progress_every: 100000
  result_buffer_size: 200
  storage_retry_seconds: 0.001
  timeout_seconds: 300
