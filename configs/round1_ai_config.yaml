# round1事件提取：提示词、AI 接口、请求及运行参数。
prompts:
  system: |
    你是文本分析助手。根据输入回答，信息不足时明确说明。
  user: |
    请用中文简要概括以下帖子：
    {{task.text}}

api:
  url: "" # 填写公司接口的完整 URL。
  headers:
    Authorization: "Bearer ${AI_API_KEY}"
  trust_env: false
  payload:
    model: glm-5.3-flash
    temperature: 0
    provider_options: max
    messages:
      - role: system
        content: "{{prompts.system}}"
      - role: user
        content: "{{prompts.user}}"
    max_completion_tokens: 512
    stream: false

run:
  concurrency: 100
  batch_size: 200
  result_buffer_size: 200
  flush_interval_seconds: 1
  timeout_seconds: 120
  requests_per_second: 0
  max_attempts: 3
  backoff_base_seconds: 1
  backoff_max_seconds: 30
  storage_max_attempts: 3
  storage_retry_seconds: 1
  progress_every: 100
