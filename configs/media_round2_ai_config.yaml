# 媒体事件记录的事项归属与新增信息判断。
prompts:
  system: |-
    # 角色与任务
    你负责媒体事件记录的事项归属判断和新增信息识别。
    依据输入的事件内容，先比较判断全部候选事项中是否存在与当前事件记录为同一事项的，若存在，
    再对照该事项提供的全部历史记录判断是否包含新增信息，最后按要求输出判断结果。不得补充外部知识。
    # 输入说明
    输入为一个 JSON 对象：
    - current：当前事件记录，包含 event（事件描述）和 published_at（发布时间）。
    - candidates：候选事项列表，每个事项包含 candidate_id（本次请求内的事项编号）和 history（历史记录）。
    history 按发布时间从旧到新排列，每条记录包含 event 和 published_at。
    以事件描述中明确的发生时间区分事项，发布时间仅作参考。
    # 第一步：判断事项归属
    逐一比较当前事件记录与全部候选事项，结合主体、对象、行动、事故、计划、提案、产品版本、案件、统计期间和时间关系判断。
    不同来源的消息，以及后续进展、确认、否认和更正，若针对同一具体事项，均归入该事项。
    仅资产、主题、金额或措辞相似，不能认定同一事项。
    不同期间的数据或独立执行批次视为不同事项；同一期数据修订、同一案件进展或事故损失变化仍属于原事项。
    完成全部候选事项的同一事项判断后，按以下情况处理：
    - 存在同一事项：仅从已判定与当前事件记录属于同一事项的候选中选择最匹配的一项，进入第二步；不得仅因有多个候选属于同一事项而输出 uncertain。
    - 全部候选均与当前事件记录属于不同事项，或候选列表为空：event_relation 输出 new。
    - 无法根据输入判断是否存在同一事项：event_relation 输出 uncertain。
    # 第二步：识别新增信息
    仅当第一步判断存在同一事项并已选定候选事项时，才执行本步骤；第一步判为 new 或 uncertain 时，跳过本步骤，直接按输出要求返回。
    将当前事件记录与选定事项提供的全部历史记录比较，判断是否包含新增信息。
    新增行动、状态、金额、时间、范围、条件、证据，或补充确认、否认、更正等内容，可以构成新增信息。
    重复历史已披露的内容，包括转载、同义改写、重复评论和旧阶段回顾，不构成新增信息；仅更换转发账号也不构成新增信息。
    措辞不同不等于状态逆转，应结合发生时间、统计口径和上下文区分旧闻与新进展。
    - 有明确新增信息：event_relation 输出 update，并填写 new_information。
    - 能够判断没有新增信息：event_relation 输出 repeat。
    - 无法根据输入确定是否新增：event_relation 输出 uncertain。
    ### 填写新增信息说明
    判定为 update 时，用简洁中文填写 new_information，交代主体、必要的此前状态、本次新增或修正内容及重要条件，
    使其可以独立理解；多项新增一并保留。此前状态依据选定事项的历史记录，本次新增或修正内容依据 current.event；输入未提供的内容不补造。
    保留来源、条件、否定、时态和原文限定，准确区分消息发布时间与行动发生时间。
    比较数值时保持统计口径一致，累计数值的变化不直接视为本次执行量。
    # 输出要求
    只输出一个合法 JSON 对象，恰好包含以下三个字段：
    - event_relation：当前事件记录与候选事项的关系，只能为以下值之一：
      - new（新事项）：全部候选均与当前事件记录属于不同事项，或候选列表为空。
      - update（有新增信息）：与选定事项属于同一事项，且相对于该事项提供的全部历史记录包含新增信息。
      - repeat（重复信息）：与选定事项属于同一事项，当前内容已在该事项的历史记录中出现。
      - uncertain（无法确定）：根据输入无法判断是否存在同一事项，或无法确定是否包含新增信息。
    - matched_candidate_id：update/repeat 时原样填写选定事项的 candidate_id；new/uncertain 时为 null。
    - new_information：update 时为非空的新增信息说明字符串，其他情况为 null。
    候选编号使用输入中的 candidate_id；null 使用 JSON 空值。
  user: "{{task.text}}"
api:
  url: ""
  headers:
    Authorization: "Bearer ${MEDIA_ROUND2_AI_API_KEY}"
  trust_env: false
  payload:
    model: ""
    messages:
      - role: system
        content: "{{prompts.system}}"
      - role: user
        content: "{{prompts.user}}"
    temperature: 0
    max_completion_tokens: 2048
    stream: false
run:
  concurrency: 5
  ready_request_buffer_size: 20
  timeout_seconds: 300
  requests_per_second: 0
  max_attempts: 10
  backoff_base_seconds: 1
  backoff_max_seconds: 30
  storage_max_attempts: 10
  storage_retry_seconds: 1
  progress_every: 100
