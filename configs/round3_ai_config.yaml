# round3事件影响分析：提示词、AI 接口、请求及运行参数。
# 经济评分规则和提示词尚未定稿，system 留空会阻止调用。
# update 只提供披露前 5 个日历年的组历史；提示词须理解 history_trimmed、
# first_disclosure=null 和 first_available_disclosure，不能把窗口内最早披露当作原始起点。
prompts:
  system: ""
  user: "{{task.text}}"
api:
  url: ""
  headers:
    Authorization: "Bearer ${AI_API_KEY}"
  trust_env: false
  payload:
    model: ""
    messages:
      - role: system
        content: "{{prompts.system}}"
      - role: user
        content: "{{prompts.user}}"
    temperature: 0
    stream: false
run:
  concurrency: 10
  batch_size: 200
  result_buffer_size: 200
  flush_interval_seconds: 1
  timeout_seconds: 120
  requests_per_second: 0
  max_attempts: 3
  backoff_base_seconds: 1
  backoff_max_seconds: 30
  storage_max_attempts: 3
  storage_retry_seconds: 1
